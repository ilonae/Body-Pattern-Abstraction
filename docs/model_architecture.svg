<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="'Segoe UI', Arial, sans-serif">

  <rect width="860" height="600" fill="#0f1117"/>

  <text x="430" y="36" text-anchor="middle" fill="#e8eaf6" font-size="17" font-weight="bold">LandmarkNet — Model Architecture</text>
  <text x="430" y="54" text-anchor="middle" fill="#7986cb" font-size="11">PointNet encoder → MLP head → body measurements</text>

  <!-- ── INPUT ── -->
  <rect x="50" y="72" width="180" height="76" rx="8" fill="#1a237e" stroke="#3949ab" stroke-width="1.5"/>
  <text x="140" y="96"  text-anchor="middle" fill="#e8eaf6" font-size="13" font-weight="bold">Input Point Cloud</text>
  <text x="140" y="113" text-anchor="middle" fill="#9fa8da" font-size="11" font-style="italic">(B, N, 3)</text>
  <text x="140" y="129" text-anchor="middle" fill="#7986cb" font-size="10">B=batch, N=2048 pts</text>
  <text x="140" y="143" text-anchor="middle" fill="#7986cb" font-size="10">XYZ normalised Y-up</text>

  <!-- dim label -->
  <text x="140" y="162" text-anchor="middle" fill="#5c6bc0" font-size="9">after PreprocessPipeline</text>

  <!-- arrow -->
  <line x1="230" y1="110" x2="265" y2="110" stroke="#3949ab" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ── TRANSPOSE ── -->
  <rect x="265" y="88" width="120" height="44" rx="6" fill="#212121" stroke="#424242" stroke-width="1"/>
  <text x="325" y="106" text-anchor="middle" fill="#bdbdbd" font-size="11">transpose(2,1)</text>
  <text x="325" y="122" text-anchor="middle" fill="#616161" font-size="10">(B, 3, N)</text>

  <line x1="385" y1="110" x2="420" y2="110" stroke="#424242" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ── POINTNET ENCODER BOX ── -->
  <rect x="420" y="68" width="380" height="230" rx="10" fill="#0d1f2d" stroke="#01579b" stroke-width="2"/>
  <text x="610" y="90"  text-anchor="middle" fill="#81d4fa" font-size="13" font-weight="bold">PointNet Encoder</text>
  <text x="610" y="106" text-anchor="middle" fill="#4fc3f7" font-size="10">Shared MLP (Conv1d) — permutation invariant</text>

  <!-- Conv1 -->
  <rect x="440" y="115" width="340" height="38" rx="6" fill="#0a2a40" stroke="#0277bd" stroke-width="1"/>
  <text x="610" y="131" text-anchor="middle" fill="#e1f5fe" font-size="11" font-weight="bold">Conv1d(3 → 64) + BatchNorm + GELU</text>
  <text x="610" y="146" text-anchor="middle" fill="#4fc3f7" font-size="9">(B, 64, N)  — each point gets a 64-dim feature independently</text>

  <!-- Arrow -->
  <line x1="610" y1="153" x2="610" y2="165" stroke="#0277bd" stroke-width="1.2" marker-end="url(#ab)"/>

  <!-- Conv2 -->
  <rect x="440" y="165" width="340" height="38" rx="6" fill="#0a2a40" stroke="#0277bd" stroke-width="1"/>
  <text x="610" y="181" text-anchor="middle" fill="#e1f5fe" font-size="11" font-weight="bold">Conv1d(64 → 128) + BatchNorm + GELU</text>
  <text x="610" y="196" text-anchor="middle" fill="#4fc3f7" font-size="9">(B, 128, N)  — richer local geometry representation</text>

  <line x1="610" y1="203" x2="610" y2="215" stroke="#0277bd" stroke-width="1.2" marker-end="url(#ab)"/>

  <!-- Conv3 -->
  <rect x="440" y="215" width="340" height="38" rx="6" fill="#0a2a40" stroke="#0277bd" stroke-width="1"/>
  <text x="610" y="231" text-anchor="middle" fill="#e1f5fe" font-size="11" font-weight="bold">Conv1d(128 → 256) + BatchNorm</text>
  <text x="610" y="246" text-anchor="middle" fill="#4fc3f7" font-size="9">(B, 256, N)  — high-level per-point features</text>

  <line x1="610" y1="253" x2="610" y2="265" stroke="#0277bd" stroke-width="1.2" marker-end="url(#ab)"/>

  <!-- MaxPool -->
  <rect x="500" y="265" width="220" height="38" rx="6" fill="#01263d" stroke="#01579b" stroke-width="1.5"/>
  <text x="610" y="281" text-anchor="middle" fill="#b3e5fc" font-size="11" font-weight="bold">Global Max Pooling</text>
  <text x="610" y="296" text-anchor="middle" fill="#4fc3f7" font-size="9">(B, 256)  — permutation invariant global descriptor</text>

  <!-- arrow out of encoder -->
  <line x1="610" y1="303" x2="610" y2="330" stroke="#01579b" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- ── MLP HEAD ── -->
  <rect x="360" y="330" width="500" height="170" rx="10" fill="#1b0032" stroke="#7b1fa2" stroke-width="2"/>
  <text x="610" y="352" text-anchor="middle" fill="#e1bee7" font-size="13" font-weight="bold">Prediction Head (MLP)</text>
  <text x="610" y="367" text-anchor="middle" fill="#ba68c8" font-size="10">maps global body descriptor → scalar measurements</text>

  <!-- Linear 256 -->
  <rect x="380" y="375" width="460" height="32" rx="5" fill="#280040" stroke="#8e24aa" stroke-width="1"/>
  <text x="610" y="391" text-anchor="middle" fill="#e1bee7" font-size="11">Linear(256 → 256) + LayerNorm + GELU + Dropout(0.3)</text>
  <text x="610" y="403" text-anchor="middle" fill="#ba68c8" font-size="9">(B, 256)</text>

  <line x1="610" y1="407" x2="610" y2="417" stroke="#8e24aa" stroke-width="1.2" marker-end="url(#ac)"/>

  <!-- Linear 128 -->
  <rect x="380" y="417" width="460" height="32" rx="5" fill="#280040" stroke="#8e24aa" stroke-width="1"/>
  <text x="610" y="433" text-anchor="middle" fill="#e1bee7" font-size="11">Linear(256 → 128) + LayerNorm + GELU + Dropout(0.3)</text>
  <text x="610" y="445" text-anchor="middle" fill="#ba68c8" font-size="9">(B, 128)</text>

  <line x1="610" y1="449" x2="610" y2="459" stroke="#8e24aa" stroke-width="1.2" marker-end="url(#ac)"/>

  <!-- Linear 7 + Sigmoid -->
  <rect x="430" y="459" width="360" height="32" rx="5" fill="#280040" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="610" y="475" text-anchor="middle" fill="#f3e5f5" font-size="11" font-weight="bold">Linear(128 → 7) + Sigmoid</text>
  <text x="610" y="487" text-anchor="middle" fill="#ba68c8" font-size="9">(B, 7) — outputs in [0, 1]</text>

  <!-- arrow to output -->
  <line x1="610" y1="500" x2="610" y2="525" stroke="#ab47bc" stroke-width="1.5" marker-end="url(#ac)"/>

  <!-- ── OUTPUT ── -->
  <rect x="350" y="525" width="520" height="58" rx="8" fill="#1a237e" stroke="#7986cb" stroke-width="2"/>
  <text x="610" y="548" text-anchor="middle" fill="#e8eaf6" font-size="12" font-weight="bold">Output: 7 normalised body measurements</text>
  <text x="610" y="564" text-anchor="middle" fill="#9fa8da" font-size="10">[shoulder_w, hip_w, waist_w, left_arm, right_arm, left_leg, right_leg]</text>
  <text x="610" y="578" text-anchor="middle" fill="#7986cb" font-size="9">→ ScanToParams threshold lookup → BodyParams (Level 0–4)</text>

  <!-- loss annotation -->
  <text x="140" y="420" text-anchor="middle" fill="#a5d6a7" font-size="11" font-weight="bold">Training:</text>
  <text x="140" y="436" text-anchor="middle" fill="#81c784" font-size="10">MSE loss vs. ground truth</text>
  <text x="140" y="451" text-anchor="middle" fill="#81c784" font-size="10">from SyntheticBodyConfig</text>
  <text x="140" y="466" text-anchor="middle" fill="#66bb6a" font-size="10">Phase 2: real scan fine-tune</text>
  <line x1="230" y1="450" x2="355" y2="450" stroke="#388e3c" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#ag)"/>

  <defs>
    <marker id="a"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#3949ab"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#0277bd"/></marker>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#8e24aa"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#616161"/></marker>
  </defs>
</svg>
